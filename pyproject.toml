[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sizegen"
version = "0.1.0"
description = "Experiments for 'Controlled Reuse for Size-Generalizable Looped GNNs'"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["sizegen*"]
