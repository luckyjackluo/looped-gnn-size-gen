## Baseline for the DEHNN iterative-controller experiment: FULL finetune (unfreeze everything, no
## loop controller, single forward). Warm-starts from the same synthetic pretrain checkpoint and
## trains on the same real DEHNN MLCAD split. Head-to-head control for
## loop_triple_peft_k6_dehnn.yaml -- tells us how much the frozen-backbone iterative controller buys
## vs simply finetuning the whole network.
task: regression
hidden_dim: 256
output_dim: 2
enforce_gnn_then_global: true
conditioning_coords: ports_only
loss_type: mse

checkpoint: data/chipgen/checkpoints/size_adaptation/pretrain_baseline_0_500/best_model.pt
reset_epochs_on_checkpoint: true
# No trainable_components -> everything trainable (full finetune).

encoder:
  type: mlp
  input_dim: auto
  coord_encoding_mode: raw
  use_coord_fourier: false
  use_pos_encoding: false
  num_layers: 3
  dropout: 0.0
  use_layer_norm: true
processor:
  type: gnn
  num_blocks: 3
  layers_per_block: 3
  layer_configs:
  - layer_type: gatv2
    heads: 4
  - layer_type: gatv2
    heads: 4
  - layer_type: gatv2
    heads: 4
    concat: false
  edge_dim: 4
  dropout: 0.0
  use_global_module: true
  gnn_blocks:
  - 0
  - 1
  global_module_blocks:
  - 2
  global_module:
    type: attention
    params:
      attention_type: transformer
      num_heads: 4
      num_layers: 2
      ff_dim: 256
      dropout: 0.0
      att_gnn_style: false
      use_pos_encoding: false
      use_rel_pos_bias: false
  use_residual: true
  use_pre_norm: true
decoder:
  num_layers: 3
  dropout: 0.0

size_conditioning:
  enabled: false

num_epochs: 60
learning_rate: 0.0001
weight_decay: 1.0e-05
batch_size: 256
use_size_bucketing: true
# DEHNN graphs are ~2x denser than v5 (avg deg 13 vs 6.5); single forward (no loop) so a larger
# budget than the controller config is fine, but still below the v5 value.
max_total_nodes: 12000
use_amp: true
save_every: 10
save_dir: data/chipgen/checkpoints/dehnn_finetune/full_finetune_dehnn
use_scheduler: true

dataset:
  type: pickle
  train_dir: data/chipgen/dehnn_mlcad_split/train
  val_dir: data/chipgen/dehnn_mlcad_split/val
  node_features:
  - w_norm_d
  - h_norm_d
  - w_log_rel
  - h_log_rel
  - aspect_ratio_norm
  - area_norm
  - chip_size
  - log_deg
  - pin_count
  - type_indicators
  - canvas_aspect_ratio
  - port_loc
  zero_edge_attr: false
  normalize_edge_attr_with_coordinates: true
  min_graph_size: 50
  max_graph_size: 4000
  max_train_samples: 10000
  train_subsample_strategy: uniform
  train_subsample_shuffle: true
  train_subsample_seed: 42
  max_val_samples: 1000
