## Size-adaptation pretrain baseline on N = 50–500.
## Architecture: 2 pure-GNN blocks (6 GATv2 layers) + 1 pure-transformer block.
##   processor.num_blocks=3, gnn_blocks=[0,1], global_module_blocks=[2].
##   Block 2 skips GNN (not in gnn_blocks); its 3 dead GAT slots remain unexecuted.
## No size-conditioning here; FiLM variants are introduced in the finetune suite.
## Pool ~17.5k graphs across 10 size buckets; uniform subsample caps training at 10k.

task: regression
hidden_dim: 256
output_dim: 2
enforce_gnn_then_global: true

conditioning_coords: ports_only
loss_type: mse

encoder:
  type: mlp
  input_dim: auto
  coord_encoding_mode: raw
  use_coord_fourier: false
  use_pos_encoding: false
  num_layers: 3
  dropout: 0.0
  use_layer_norm: true

processor:
  type: gnn
  num_blocks: 3
  layers_per_block: 3
  layer_configs:
    - layer_type: gatv2
      heads: 4
    - layer_type: gatv2
      heads: 4
    - layer_type: gatv2
      heads: 4
      concat: false
  edge_dim: 4
  dropout: 0.0
  use_global_module: true
  gnn_blocks: [0, 1]
  global_module_blocks: [2]
  global_module:
    type: attention
    params:
      attention_type: transformer
      num_heads: 4
      num_layers: 2
      ff_dim: 256
      dropout: 0.0
      att_gnn_style: false
      use_pos_encoding: false
      use_rel_pos_bias: false
  use_residual: true
  use_pre_norm: true

decoder:
  num_layers: 3
  dropout: 0.0

size_conditioning:
  enabled: false

num_epochs: 100
learning_rate: 0.00025
weight_decay: 0.00001
batch_size: 512
use_size_bucketing: true
max_total_nodes: 30000
use_amp: true
save_every: 10
save_dir: data/chipgen/checkpoints/size_adaptation/pretrain_baseline_0_500

use_scheduler: true

dataset:
  type: pickle
  train_dir: data/chipgen/raw/training_packing_alg
  val_dir: data/chipgen/raw/training_packing_alg
  node_features:
    - w_norm_d
    - h_norm_d
    - w_log_rel
    - h_log_rel
    - aspect_ratio_norm
    - area_norm
    - chip_size
    - log_deg
    - pin_count
    - type_indicators
    - canvas_aspect_ratio
    - port_loc
  zero_edge_attr: false
  normalize_edge_attr_with_coordinates: true
  min_graph_size: 50
  max_graph_size: 500
  # All available batches across N ∈ {50,100,150,200,250,300,350,400,450,500}.
  # packing_alg_n500_batch005 is held out as val. Pool ≈17.5k graphs; uniform
